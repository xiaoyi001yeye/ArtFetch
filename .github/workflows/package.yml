name: Package

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve image names
        id: images
        run: |
          backend_image="artfetch-backend"
          frontend_image="artfetch-frontend"
          jupyter_image="artfetch-jupyter"
          git_sha="$(git rev-parse HEAD)"
          git_short_sha="$(git rev-parse --short HEAD)"
          backend_tag="${backend_image}:sha-${git_sha}"
          frontend_tag="${frontend_image}:sha-${git_sha}"
          jupyter_tag="${jupyter_image}:sha-${git_sha}"
          {
            echo "BACKEND_IMAGE=${backend_image}"
            echo "FRONTEND_IMAGE=${frontend_image}"
            echo "JUPYTER_IMAGE=${jupyter_image}"
            echo "BACKEND_TAG=${backend_tag}"
            echo "FRONTEND_TAG=${frontend_tag}"
            echo "JUPYTER_TAG=${jupyter_tag}"
            echo "GIT_SHA=${git_sha}"
            echo "GIT_SHORT_SHA=${git_short_sha}"
          } >> "$GITHUB_ENV"
          {
            echo "backend_image=${backend_image}"
            echo "frontend_image=${frontend_image}"
            echo "jupyter_image=${jupyter_image}"
            echo "backend_tag=${backend_tag}"
            echo "frontend_tag=${frontend_tag}"
            echo "jupyter_tag=${jupyter_tag}"
            echo "git_sha=${git_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.backend_tag }}
          labels: |
            org.opencontainers.image.title=ArtFetch Backend
            org.opencontainers.image.revision=${{ steps.images.outputs.git_sha }}

      - name: Build frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.frontend_tag }}
          labels: |
            org.opencontainers.image.title=ArtFetch Frontend
            org.opencontainers.image.revision=${{ steps.images.outputs.git_sha }}

      - name: Build Jupyter image
        id: jupyter
        uses: docker/build-push-action@v6
        with:
          context: ml
          push: false
          load: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.jupyter_tag }}
          labels: |
            org.opencontainers.image.title=ArtFetch Jupyter
            org.opencontainers.image.revision=${{ steps.images.outputs.git_sha }}

      - name: Save image tarballs
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifact/images
          docker save "$BACKEND_TAG" | gzip -c > "artifact/images/artfetch-backend-${GIT_SHA}.tar.gz"
          docker save "$FRONTEND_TAG" | gzip -c > "artifact/images/artfetch-frontend-${GIT_SHA}.tar.gz"
          docker save "$JUPYTER_TAG" | gzip -c > "artifact/images/artfetch-jupyter-${GIT_SHA}.tar.gz"
          (
            cd artifact/images
            sha256sum "artfetch-backend-${GIT_SHA}.tar.gz" > "artfetch-backend-${GIT_SHA}.tar.gz.sha256"
            sha256sum "artfetch-frontend-${GIT_SHA}.tar.gz" > "artfetch-frontend-${GIT_SHA}.tar.gz.sha256"
            sha256sum "artfetch-jupyter-${GIT_SHA}.tar.gz" > "artfetch-jupyter-${GIT_SHA}.tar.gz.sha256"
          )
          {
            echo "BACKEND_IMAGE_ID=$(docker image inspect "$BACKEND_TAG" --format '{{.Id}}')"
            echo "FRONTEND_IMAGE_ID=$(docker image inspect "$FRONTEND_TAG" --format '{{.Id}}')"
            echo "JUPYTER_IMAGE_ID=$(docker image inspect "$JUPYTER_TAG" --format '{{.Id}}')"
            echo "BACKEND_TAR_SHA256=$(sha256sum "artifact/images/artfetch-backend-${GIT_SHA}.tar.gz" | awk '{print $1}')"
            echo "FRONTEND_TAR_SHA256=$(sha256sum "artifact/images/artfetch-frontend-${GIT_SHA}.tar.gz" | awk '{print $1}')"
            echo "JUPYTER_TAR_SHA256=$(sha256sum "artifact/images/artfetch-jupyter-${GIT_SHA}.tar.gz" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Generate candidate manifest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifact/scripts
          cp docker-compose.prod.yml artifact/
          cp .env.example artifact/
          cp scripts/deploy/*.sh artifact/scripts/
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          sha = os.environ["GIT_SHA"]
          manifest = {
              "app": "artfetch",
              "gitSha": sha,
              "gitShortSha": os.environ["GIT_SHORT_SHA"],
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "images": {
                  "backend": {
                      "tag": os.environ["BACKEND_TAG"],
                      "ref": os.environ["BACKEND_TAG"],
                      "imageId": os.environ["BACKEND_IMAGE_ID"],
                      "tar": f'images/artfetch-backend-{sha}.tar.gz',
                      "tarSha256": os.environ["BACKEND_TAR_SHA256"],
                  },
                  "frontend": {
                      "tag": os.environ["FRONTEND_TAG"],
                      "ref": os.environ["FRONTEND_TAG"],
                      "imageId": os.environ["FRONTEND_IMAGE_ID"],
                      "tar": f'images/artfetch-frontend-{sha}.tar.gz',
                      "tarSha256": os.environ["FRONTEND_TAR_SHA256"],
                  },
                  "jupyter": {
                      "tag": os.environ["JUPYTER_TAG"],
                      "ref": os.environ["JUPYTER_TAG"],
                      "imageId": os.environ["JUPYTER_IMAGE_ID"],
                      "tar": f'images/artfetch-jupyter-{sha}.tar.gz',
                      "tarSha256": os.environ["JUPYTER_TAR_SHA256"],
                  },
              },
              "externalImages": {
                  "postgres": {
                      "service": "postgres",
                      "ref": "postgres:16-alpine",
                  },
              },
              "compose": {
                  "file": "docker-compose.prod.yml",
                  "sha256": hashlib.sha256(Path("artifact/docker-compose.prod.yml").read_bytes()).hexdigest(),
              },
              "build": {
                  "backendTest": "passed",
                  "frontendBuild": "passed",
                  "imageBuild": "passed",
                  "imageExport": "passed",
              },
          }
          Path("artifact/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload candidate artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: artfetch-package-${{ steps.images.outputs.git_sha }}
          path: artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
