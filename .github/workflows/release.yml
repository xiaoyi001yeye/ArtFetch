name: Release

on:
  workflow_dispatch:
    inputs:
      packageRunId:
        description: Successful Package workflow run ID
        required: true
      version:
        description: Release version in YYYY.MM.DD.N format
        required: true
      releaseNotes:
        description: Human-readable release notes
        required: true

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Validate Package run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.packageRunId }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)"
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .name)"
          if [ "$workflow" != "Package" ] || [ "$conclusion" != "success" ]; then
            echo "Package run ${RUN_ID} is not a successful Package workflow run."
            exit 1
          fi

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          pattern: artfetch-package-*
          path: artifact
          merge-multiple: true
          run-id: ${{ inputs.packageRunId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate candidate images
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifact/release-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("app") != "artfetch":
              raise SystemExit("Manifest app must be artfetch")
          for service in ("backend", "frontend"):
              ref = manifest["images"][service]["ref"]
              if "@sha256:" not in ref:
                  raise SystemExit(f"{service} ref is not immutable: {ref}")
          PY
          while IFS= read -r ref; do
            docker buildx imagetools inspect "$ref" >/dev/null
          done < <(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifact/release-manifest.json").read_text(encoding="utf-8"))
          print(manifest["images"]["backend"]["ref"])
          print(manifest["images"]["frontend"]["ref"])
          PY
          )

      - name: Build release assets
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_RUN_ID: ${{ inputs.packageRunId }}
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          mkdir -p "dist/artfetch-deploy-${VERSION}"
          cp -R artifact/. "dist/artfetch-deploy-${VERSION}/"
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          path = Path(f'dist/artfetch-deploy-{os.environ["VERSION"]}/release-manifest.json')
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VERSION"]
          manifest["releasedAt"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          manifest["packageRunId"] = os.environ["PACKAGE_RUN_ID"]
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          tar -C dist -czf "dist/artfetch-deploy-${VERSION}.tgz" "artfetch-deploy-${VERSION}"
          (cd dist && sha256sum "artfetch-deploy-${VERSION}.tgz" > "artfetch-deploy-${VERSION}.tgz.sha256")
          cp "dist/artfetch-deploy-${VERSION}/release-manifest.json" dist/release-manifest.json
          printf '%s\n' "$RELEASE_NOTES" > dist/release-notes.md
          cat > dist/deployment-instructions.md <<EOF
          Deploy \`${VERSION}\` with the manually approved \`Deploy Production\` workflow.
          The deployment consumes immutable image digests from \`release-manifest.json\`.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git tag "release/${VERSION}" "$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["gitSha"])')"
          git push origin "release/${VERSION}"
          gh release create "release/${VERSION}" \
            dist/release-manifest.json \
            "dist/artfetch-deploy-${VERSION}.tgz" \
            "dist/artfetch-deploy-${VERSION}.tgz.sha256" \
            dist/deployment-instructions.md \
            --title "${VERSION}" \
            --notes-file dist/release-notes.md \
            --verify-tag
