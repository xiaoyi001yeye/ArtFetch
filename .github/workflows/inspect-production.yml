name: Inspect Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Inspect production server
        env:
          PROD_PROJECT_DIR: ${{ secrets.PROD_PROJECT_DIR }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          target="${PROD_SSH_USER}@${PROD_SSH_HOST}"
          project_dir="${PROD_PROJECT_DIR:-/opt/artfetch}"
          ssh "$target" "PROJECT_DIR='$project_dir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$PROJECT_DIR"

          compose_release() {
            docker compose --env-file .env --env-file .env.release -f docker-compose.prod.yml "$@"
          }

          echo "== host =="
          hostname
          date -Is
          echo

          echo "== active release =="
          test -f release-manifest.json && python3 - <<'PY' || true
          import json
          from pathlib import Path
          manifest = json.loads(Path("release-manifest.json").read_text())
          print("version=" + str(manifest.get("version")))
          print("gitSha=" + str(manifest.get("gitSha")))
          for service in ("backend", "frontend"):
              print(service + "=" + manifest["images"][service]["ref"])
          PY
          echo

          echo "== compose ps =="
          compose_release ps
          echo

          echo "== container health =="
          docker inspect artfetch-postgres artfetch-backend artfetch-frontend \
            --format '{{.Name}} status={{.State.Status}} restarting={{.State.Restarting}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Config.Image}}'
          echo

          echo "== local backend health =="
          curl -fsS --connect-timeout 5 --max-time 20 http://127.0.0.1:8080/actuator/health
          echo
          echo

          echo "== local frontend headers =="
          curl -vfsS --connect-timeout 5 --max-time 20 http://127.0.0.1:3000/ -o /tmp/artfetch-front-body 2>&1 | sed -n '1,80p'
          echo

          echo "== local api auth =="
          curl -sS --connect-timeout 5 --max-time 20 -o /tmp/artfetch-auth-body -w 'http_code=%{http_code}\n' http://127.0.0.1:3000/api/auth/me || true
          sed -n '1,20p' /tmp/artfetch-auth-body || true
          echo

          echo "== frontend logs tail =="
          compose_release logs --tail=120 frontend || true
          echo

          echo "== backend logs tail =="
          compose_release logs --tail=120 backend || true
          REMOTE
