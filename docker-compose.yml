version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artfetch-postgres
    environment:
      POSTGRES_DB: artfetch
      POSTGRES_USER: artfetch
      POSTGRES_PASSWORD: artfetch123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artfetch -d artfetch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artfetch-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artfetch
      SPRING_DATASOURCE_USERNAME: artfetch
      SPRING_DATASOURCE_PASSWORD: artfetch123
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      ARTFETCH_SOURCE_BASE_URL: ${ARTWORK_SOURCE_URL:-https://artso.artron.net/auction/search_auction.php}
      ARTFETCH_SOURCE_REQUEST_DELAY_MS: ${REQUEST_DELAY_MS:-300}
      ARTFETCH_AUTH_ARTRON_COOKIE: ${ARTFETCH_AUTH_ARTRON_COOKIE:-}
      ARTFETCH_AUTH_ARTRON_ACCOUNT: ${ARTFETCH_AUTH_ARTRON_ACCOUNT:-}
      ARTFETCH_AUTH_ARTRON_PASSWORD: ${ARTFETCH_AUTH_ARTRON_PASSWORD:-}
      ARTFETCH_IMAGE_STORAGE_PATH: /app/storage/original-images
      LOG_PATH: /app/logs
    volumes:
      - ./backend/logs:/app/logs
      - ./storage/original-images:/app/storage/original-images
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artfetch-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  jupyter:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: artfetch-jupyter
    environment:
      ARTFETCH_DB_HOST: postgres
      ARTFETCH_DB_PORT: 5432
      ARTFETCH_DB_NAME: artfetch
      ARTFETCH_DB_USER: artfetch
      ARTFETCH_DB_PASSWORD: artfetch123
      PYTHONPATH: /workspace/src
    ports:
      - "8888:8888"
    volumes:
      - ./ml:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
