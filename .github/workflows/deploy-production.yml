name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub Release version in YYYY.MM.DD.N format
        required: true
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy inputs
        id: deploy
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -Eeuo pipefail
          echo "::group::Resolve deploy inputs"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ] && printf '%s' "${RELEASE_TAG}" | grep -Eq '^release/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            version="${RELEASE_TAG#release/}"
          else
            echo "Deploy must be triggered manually or by a release/YYYY.MM.DD.N published release."
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "Invalid version: ${version}"
            exit 1
          fi

          echo "version=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -Eeuo pipefail
          echo "::group::Download release assets"
          mkdir release
          gh release download "release/${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'release-manifest.json' \
            --pattern "artfetch-deploy-${VERSION}.tgz" \
            --pattern "artfetch-deploy-${VERSION}.tgz.sha256" \
            --dir release
          echo "Downloaded assets:"
          find release -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          (cd release && sha256sum -c "artfetch-deploy-${VERSION}.tgz.sha256")
          tar -C release -xzf "release/artfetch-deploy-${VERSION}.tgz"
          echo "Package contents:"
          find "release/artfetch-deploy-${VERSION}" -maxdepth 3 -type f -printf '%P %s bytes\n' | sort
          echo "Manifest summary:"
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/release-manifest.json").read_text(encoding="utf-8"))
          print("app=" + str(manifest.get("app")))
          print("version=" + str(manifest.get("version")))
          print("gitSha=" + str(manifest.get("gitSha")))
          print("backend=" + manifest["images"]["backend"]["ref"])
          print("frontend=" + manifest["images"]["frontend"]["ref"])
          print("composeSha256=" + manifest["compose"]["sha256"])
          PY
          echo "::endgroup::"

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          echo "::group::Configure SSH"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          echo "Private key fingerprint:"
          ssh-keygen -lf ~/.ssh/id_ed25519
          echo "Known hosts entries: $(wc -l < ~/.ssh/known_hosts)"
          echo "::endgroup::"

      - name: Log production server in to GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail
          echo "::group::SSH connectivity"
          target="${PROD_SSH_USER}@${PROD_SSH_HOST}"
          echo "target_user=${PROD_SSH_USER}"
          echo "target_host=${PROD_SSH_HOST}"
          ssh -o BatchMode=yes "$target" 'echo "connected host=$(hostname) user=$(whoami) date=$(date -Is)"'
          echo "::endgroup::"

          echo "::group::GHCR login on production server"
          if [ -n "$GHCR_READ_TOKEN" ]; then
            # shellcheck disable=SC2029
            printf '%s' "$GHCR_READ_TOKEN" |
              ssh "$target" \
                "docker login ghcr.io -u $(printf '%q' "$GHCR_READ_USER") --password-stdin"
          else
            echo "GHCR_READ_TOKEN is empty; deployment will use anonymous image pulls."
          fi
          echo "::endgroup::"

      - name: Deploy immutable release
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
          PROD_PROJECT_DIR: ${{ secrets.PROD_PROJECT_DIR }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail
          target="${PROD_SSH_USER}@${PROD_SSH_HOST}"
          project_dir="${PROD_PROJECT_DIR:-/opt/artfetch}"
          echo "::group::Production preflight snapshot"
          # shellcheck disable=SC2029
          ssh "$target" "PROJECT_DIR='$project_dir' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          echo "host=$(hostname)"
          echo "date=$(date -Is)"
          echo "project_dir=${PROJECT_DIR}"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "project directory missing"
            exit 0
          fi
          cd "$PROJECT_DIR"
          echo "pwd=$(pwd)"
          echo "files:"
          ls -la | sed -n '1,80p'
          echo "disk:"
          df -h "$PROJECT_DIR" || true
          echo "docker:"
          docker --version || true
          docker compose version || true
          echo "env presence:"
          if [ -f .env ]; then
            mode="$(stat -c '%a' .env 2>/dev/null || echo unknown)"
            echo ".env present mode=${mode}"
            for key in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD ARTFETCH_ADMIN_PASSWORD ARTFETCH_OBJECT_STORAGE_ENCRYPTION_KEY; do
              if grep -Eq "^${key}=.+" .env; then
                echo "${key}=set"
              else
                echo "${key}=missing_or_empty"
              fi
            done
          else
            echo ".env missing"
          fi
          test ! -f .env.release || echo ".env.release present mode=$(stat -c '%a' .env.release 2>/dev/null || echo unknown)"
          test ! -f active-compose-file || echo "active-compose-file=$(cat active-compose-file)"
          if [ -f release-manifest.json ]; then
            echo "current release manifest:"
            python3 - <<'PY' || true
          import json
          from pathlib import Path
          manifest = json.loads(Path("release-manifest.json").read_text(encoding="utf-8"))
          print("version=" + str(manifest.get("version")))
          print("gitSha=" + str(manifest.get("gitSha")))
          for service in ("backend", "frontend"):
              print(service + "=" + manifest["images"][service]["ref"])
          PY
          fi
          if [ -f docker-compose.prod.yml ]; then
            echo "compose services:"
            docker compose --env-file .env --env-file .env.release -f docker-compose.prod.yml config --services || true
            echo "compose ps:"
            docker compose --env-file .env --env-file .env.release -f docker-compose.prod.yml ps || true
          elif [ -f docker-compose.yml ]; then
            echo "compose services:"
            docker compose --env-file .env -f docker-compose.yml config --services || true
            echo "compose ps:"
            docker compose --env-file .env -f docker-compose.yml ps || true
          else
            echo "no compose file present"
          fi
          echo "artfetch containers:"
          docker ps -a --filter 'name=artfetch' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}' || true
          REMOTE
          echo "::endgroup::"

          echo "::group::Upload release package and deploy scripts"
          # shellcheck disable=SC2029
          scp "release/artfetch-deploy-${VERSION}.tgz" \
            "release/artfetch-deploy-${VERSION}.tgz.sha256" \
            "$target:/tmp/"
          # shellcheck disable=SC2029
          ssh "$target" "mkdir -p '$project_dir/scripts'"
          # shellcheck disable=SC2029
          scp "release/artfetch-deploy-${VERSION}/scripts/artfetch-deploy-release.sh" \
            "release/artfetch-deploy-${VERSION}/scripts/artfetch-rollback-release.sh" \
            "$target:$project_dir/scripts/"
          echo "::endgroup::"

          echo "::group::Run remote deploy script"
          # shellcheck disable=SC2029
          ssh "$target" \
            "PROJECT_DIR='$project_dir' BASE_URL='http://127.0.0.1:3000' bash '$project_dir/scripts/artfetch-deploy-release.sh' '$VERSION' '/tmp/artfetch-deploy-${VERSION}.tgz'"
          echo "::endgroup::"
