name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub Release version in YYYY.MM.DD.N format
        required: true
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy inputs
        id: deploy
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ] && printf '%s' "${RELEASE_TAG}" | grep -Eq '^release/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            version="${RELEASE_TAG#release/}"
          else
            echo "Deploy must be triggered manually or by a release/YYYY.MM.DD.N published release."
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "Invalid version: ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          mkdir release
          gh release download "release/${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'release-manifest.json' \
            --pattern "artfetch-deploy-${VERSION}.tgz" \
            --pattern "artfetch-deploy-${VERSION}.tgz.sha256" \
            --dir release
          (cd release && sha256sum -c "artfetch-deploy-${VERSION}.tgz.sha256")
          tar -C release -xzf "release/artfetch-deploy-${VERSION}.tgz"

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Log production server in to GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          if [ -n "$GHCR_READ_TOKEN" ]; then
            # shellcheck disable=SC2029
            printf '%s' "$GHCR_READ_TOKEN" |
              ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
                "docker login ghcr.io -u $(printf '%q' "$GHCR_READ_USER") --password-stdin"
          else
            echo "GHCR_READ_TOKEN is empty; deployment will use anonymous image pulls."
          fi

      - name: Deploy immutable release
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
          PROD_PROJECT_DIR: ${{ secrets.PROD_PROJECT_DIR }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          target="${PROD_SSH_USER}@${PROD_SSH_HOST}"
          project_dir="${PROD_PROJECT_DIR:-/opt/artfetch}"
          # shellcheck disable=SC2029
          scp "release/artfetch-deploy-${VERSION}.tgz" \
            "release/artfetch-deploy-${VERSION}.tgz.sha256" \
            "$target:/tmp/"
          # shellcheck disable=SC2029
          ssh "$target" "mkdir -p '$project_dir/scripts'"
          # shellcheck disable=SC2029
          scp "release/artfetch-deploy-${VERSION}/scripts/artfetch-deploy-release.sh" \
            "release/artfetch-deploy-${VERSION}/scripts/artfetch-rollback-release.sh" \
            "$target:$project_dir/scripts/"
          # shellcheck disable=SC2029
          ssh "$target" \
            "PROJECT_DIR='$project_dir' bash '$project_dir/scripts/artfetch-deploy-release.sh' '$VERSION' '/tmp/artfetch-deploy-${VERSION}.tgz'"
