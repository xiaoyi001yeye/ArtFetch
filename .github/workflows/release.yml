name: Release

on:
  workflow_dispatch:
    inputs:
      packageRunId:
        description: Successful Package workflow run ID
        required: true
      version:
        description: Release version in YYYY.MM.DD.N format
        required: true
      releaseNotes:
        description: Human-readable release notes
        required: true
  push:
    tags:
      - "release/*"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release inputs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PACKAGE_RUN_ID: ${{ github.event.inputs.packageRunId || '' }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.releaseNotes || '' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            package_run_id="${INPUT_PACKAGE_RUN_ID}"
            version="${INPUT_VERSION}"
            release_notes="${INPUT_RELEASE_NOTES}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ] && printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^release/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            version="${GITHUB_REF_NAME#release/}"
            git_sha="$(git rev-parse HEAD)"
            package_run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/package.yml/runs?branch=main&event=push&status=completed&per_page=20" \
                --jq ".workflow_runs[] | select(.head_sha == \"${git_sha}\" and .conclusion == \"success\") | .id" \
                | head -n 1
            )"
            release_notes="Release ${version} from ${git_sha}."
          else
            echo "Release must be triggered manually or by a release/YYYY.MM.DD.N tag."
            exit 1
          fi

          if [ -z "${package_run_id}" ]; then
            echo "Could not resolve a successful Package workflow run for this release."
            exit 1
          fi

          {
            echo "packageRunId=${package_run_id}"
            echo "version=${version}"
            echo "releaseNotes<<EOF"
            printf '%s\n' "${release_notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Validate Package run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.release.outputs.packageRunId }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)"
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .name)"
          if [ "$workflow" != "Package" ] || [ "$conclusion" != "success" ]; then
            echo "Package run ${RUN_ID} is not a successful Package workflow run."
            exit 1
          fi

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          pattern: artfetch-package-*
          path: artifact
          merge-multiple: true
          run-id: ${{ steps.release.outputs.packageRunId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate candidate image tarballs
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = json.loads(Path("artifact/release-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("app") != "artfetch":
              raise SystemExit("Manifest app must be artfetch")
          for service in ("backend", "frontend", "jupyter"):
              image = manifest["images"][service]
              ref = image["ref"]
              if not ref.startswith(f"artfetch-{service}:sha-"):
                  raise SystemExit(f"{service} ref must be a local sha tag: {ref}")
              tar_path = Path("artifact") / image["tar"]
              if not tar_path.is_file():
                  raise SystemExit(f"{service} image tar is missing: {tar_path}")
              actual = sha256_file(tar_path)
              expected = image["tarSha256"]
              if actual != expected:
                  raise SystemExit(f"{service} image tar sha mismatch: {actual} != {expected}")
          PY
          (cd artifact/images && sha256sum -c *.sha256)

      - name: Build release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_RUN_ID: ${{ steps.release.outputs.packageRunId }}
          RELEASE_NOTES: ${{ steps.release.outputs.releaseNotes }}
        run: |
          mkdir -p "dist/artfetch-deploy-${VERSION}"
          cp -R artifact/. "dist/artfetch-deploy-${VERSION}/"
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          path = Path(f'dist/artfetch-deploy-{os.environ["VERSION"]}/release-manifest.json')
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VERSION"]
          manifest["releasedAt"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          manifest["packageRunId"] = os.environ["PACKAGE_RUN_ID"]
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          tar -C dist -czf "dist/artfetch-deploy-${VERSION}.tgz" "artfetch-deploy-${VERSION}"
          (cd dist && sha256sum "artfetch-deploy-${VERSION}.tgz" > "artfetch-deploy-${VERSION}.tgz.sha256")
          cp "dist/artfetch-deploy-${VERSION}/release-manifest.json" dist/release-manifest.json
          printf '%s\n' "$RELEASE_NOTES" > dist/release-notes.md
          cat > dist/deployment-instructions.md <<EOF
          Deploy \`${VERSION}\` with the manually approved \`Deploy Production\` workflow.
          The deployment loads Docker image tarballs from \`artfetch-deploy-${VERSION}.tgz\`.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          manifest_sha="$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["gitSha"])')"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git tag "release/${VERSION}" "${manifest_sha}"
            git push origin "release/${VERSION}"
          elif [ "$(git rev-parse HEAD)" != "${manifest_sha}" ]; then
            echo "Tag commit does not match release manifest gitSha."
            exit 1
          fi
          gh release create "release/${VERSION}" \
            dist/release-manifest.json \
            "dist/artfetch-deploy-${VERSION}.tgz" \
            "dist/artfetch-deploy-${VERSION}.tgz.sha256" \
            dist/deployment-instructions.md \
            --title "${VERSION}" \
            --notes-file dist/release-notes.md \
            --verify-tag
