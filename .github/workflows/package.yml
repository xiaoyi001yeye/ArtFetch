name: Package

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve image names
        id: images
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          backend_image="${REGISTRY}/${owner}/artfetch-backend"
          frontend_image="${REGISTRY}/${owner}/artfetch-frontend"
          git_sha="$(git rev-parse HEAD)"
          git_short_sha="$(git rev-parse --short HEAD)"
          {
            echo "BACKEND_IMAGE=${backend_image}"
            echo "FRONTEND_IMAGE=${frontend_image}"
            echo "GIT_SHA=${git_sha}"
            echo "GIT_SHORT_SHA=${git_short_sha}"
          } >> "$GITHUB_ENV"
          {
            echo "backend_image=${backend_image}"
            echo "frontend_image=${frontend_image}"
            echo "git_sha=${git_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.backend_image }}:sha-${{ steps.images.outputs.git_sha }}
          labels: |
            org.opencontainers.image.title=ArtFetch Backend
            org.opencontainers.image.revision=${{ steps.images.outputs.git_sha }}

      - name: Build frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.frontend_image }}:sha-${{ steps.images.outputs.git_sha }}
          labels: |
            org.opencontainers.image.title=ArtFetch Frontend
            org.opencontainers.image.revision=${{ steps.images.outputs.git_sha }}

      - name: Generate candidate manifest
        if: github.event_name != 'pull_request'
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          mkdir -p artifact/scripts
          cp docker-compose.prod.yml artifact/
          cp .env.example artifact/
          cp scripts/deploy/*.sh artifact/scripts/
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          sha = os.environ["GIT_SHA"]
          manifest = {
              "app": "artfetch",
              "gitSha": sha,
              "gitShortSha": os.environ["GIT_SHORT_SHA"],
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "images": {
                  "backend": {
                      "tag": f'{os.environ["BACKEND_IMAGE"]}:sha-{sha}',
                      "digest": os.environ["BACKEND_DIGEST"],
                      "ref": f'{os.environ["BACKEND_IMAGE"]}@{os.environ["BACKEND_DIGEST"]}',
                  },
                  "frontend": {
                      "tag": f'{os.environ["FRONTEND_IMAGE"]}:sha-{sha}',
                      "digest": os.environ["FRONTEND_DIGEST"],
                      "ref": f'{os.environ["FRONTEND_IMAGE"]}@{os.environ["FRONTEND_DIGEST"]}',
                  },
              },
              "compose": {
                  "file": "docker-compose.prod.yml",
                  "sha256": hashlib.sha256(Path("artifact/docker-compose.prod.yml").read_bytes()).hexdigest(),
              },
              "build": {
                  "backendTest": "passed",
                  "frontendBuild": "passed",
                  "imageBuild": "passed",
              },
          }
          Path("artifact/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload candidate artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: artfetch-package-${{ steps.images.outputs.git_sha }}
          path: artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
