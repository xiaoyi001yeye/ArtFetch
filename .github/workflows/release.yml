name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example V1.0.0
        required: true
      releaseNotes:
        description: Human-readable release notes
        required: true
  push:
    tags:
      - "release/V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release inputs
        id: release
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.releaseNotes || '' }}
        run: |
          set -Eeuo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
            release_notes="${INPUT_RELEASE_NOTES}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ] && printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^release/V[0-9]+\.[0-9]+\.[0-9]+$'; then
            version="${GITHUB_REF_NAME#release/}"
            release_notes="Release ${version} from ${GITHUB_SHA}."
          else
            echo "Release must be triggered manually or by a release/Vx.y.z tag."
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^V[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: ${version}. Expected Vx.y.z, for example V1.0.0."
            exit 1
          fi
          if [ -z "$release_notes" ]; then
            echo "Release notes are required for manual releases."
            exit 1
          fi

          latest_flyway="$(
            find backend/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
              | sed -E 's/^(V[0-9]+(\.[0-9]+)*)__.*$/\1/' \
              | sort -V \
              | tail -n 1
          )"
          if [ -z "$latest_flyway" ]; then
            echo "No Flyway migration files found."
            exit 1
          fi
          if [ "$latest_flyway" != "$version" ]; then
            echo "Release version must match latest Flyway version. input=${version} latestFlyway=${latest_flyway}"
            exit 1
          fi

          git_sha="$(git rev-parse HEAD)"
          git_short_sha="$(git rev-parse --short HEAD)"
          {
            echo "version=${version}"
            echo "flywayVersion=${latest_flyway}"
            echo "gitSha=${git_sha}"
            echo "gitShortSha=${git_short_sha}"
            echo "releaseNotes<<EOF"
            printf '%s\n' "${release_notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: |
            artfetch-backend:${{ steps.release.outputs.version }}
            artfetch-backend:sha-${{ steps.release.outputs.gitSha }}
          labels: |
            org.opencontainers.image.title=ArtFetch Backend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.gitSha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: |
            artfetch-frontend:${{ steps.release.outputs.version }}
            artfetch-frontend:sha-${{ steps.release.outputs.gitSha }}
          labels: |
            org.opencontainers.image.title=ArtFetch Frontend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.gitSha }}

      - name: Build Jupyter image
        uses: docker/build-push-action@v6
        with:
          context: ml
          push: false
          load: true
          tags: |
            artfetch-jupyter:${{ steps.release.outputs.version }}
            artfetch-jupyter:sha-${{ steps.release.outputs.gitSha }}
          labels: |
            org.opencontainers.image.title=ArtFetch Jupyter
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.gitSha }}

      - name: Pull external runtime images
        run: docker pull postgres:16-alpine

      - name: Build release package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FLYWAY_VERSION: ${{ steps.release.outputs.flywayVersion }}
          GIT_SHA: ${{ steps.release.outputs.gitSha }}
          GIT_SHORT_SHA: ${{ steps.release.outputs.gitShortSha }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          dist_dir="dist"
          release_dir="${dist_dir}/artfetch-deploy-${VERSION}"
          rm -rf "$dist_dir"
          mkdir -p "${release_dir}/images" "${release_dir}/scripts"

          cp docker-compose.prod.yml "${release_dir}/docker-compose.prod.yml"
          cp .env.example "${release_dir}/.env.example"
          cp scripts/deploy/artfetch-install-or-upgrade.sh "${release_dir}/scripts/artfetch-install-or-upgrade.sh"
          cp scripts/deploy/artfetch-clean-failed-install.sh "${release_dir}/scripts/artfetch-clean-failed-install.sh"
          cp scripts/deploy/install-or-upgrade-latest.sh "${dist_dir}/install-or-upgrade-latest.sh"
          sed -i "s#__GITHUB_REPOSITORY__#${GITHUB_REPOSITORY_NAME}#g" "${dist_dir}/install-or-upgrade-latest.sh"
          chmod +x "${release_dir}/scripts/"*.sh "${dist_dir}/install-or-upgrade-latest.sh"

          backend_version_tag="artfetch-backend:${VERSION}"
          backend_sha_tag="artfetch-backend:sha-${GIT_SHA}"
          frontend_version_tag="artfetch-frontend:${VERSION}"
          frontend_sha_tag="artfetch-frontend:sha-${GIT_SHA}"
          jupyter_version_tag="artfetch-jupyter:${VERSION}"
          jupyter_sha_tag="artfetch-jupyter:sha-${GIT_SHA}"
          postgres_ref="postgres:16-alpine"

          docker save "$backend_version_tag" "$backend_sha_tag" | gzip -c > "${release_dir}/images/artfetch-backend-${VERSION}.tar.gz"
          docker save "$frontend_version_tag" "$frontend_sha_tag" | gzip -c > "${release_dir}/images/artfetch-frontend-${VERSION}.tar.gz"
          docker save "$jupyter_version_tag" "$jupyter_sha_tag" | gzip -c > "${release_dir}/images/artfetch-jupyter-${VERSION}.tar.gz"
          docker save "$postgres_ref" | gzip -c > "${release_dir}/images/postgres-16-alpine.tar.gz"

          (
            cd "${release_dir}/images"
            sha256sum artfetch-backend-${VERSION}.tar.gz > artfetch-backend-${VERSION}.tar.gz.sha256
            sha256sum artfetch-frontend-${VERSION}.tar.gz > artfetch-frontend-${VERSION}.tar.gz.sha256
            sha256sum artfetch-jupyter-${VERSION}.tar.gz > artfetch-jupyter-${VERSION}.tar.gz.sha256
            sha256sum postgres-16-alpine.tar.gz > postgres-16-alpine.tar.gz.sha256
          )

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          git_sha = os.environ["GIT_SHA"]
          release_dir = Path("dist") / f"artfetch-deploy-{version}"

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def image_id(ref: str) -> str:
              import subprocess
              return subprocess.check_output(
                  ["docker", "image", "inspect", ref, "--format", "{{.Id}}"],
                  text=True,
              ).strip()

          images = {
              "backend": {
                  "service": "backend",
                  "versionTag": f"artfetch-backend:{version}",
                  "shaTag": f"artfetch-backend:sha-{git_sha}",
                  "imageId": image_id(f"artfetch-backend:{version}"),
                  "tar": f"images/artfetch-backend-{version}.tar.gz",
              },
              "frontend": {
                  "service": "frontend",
                  "versionTag": f"artfetch-frontend:{version}",
                  "shaTag": f"artfetch-frontend:sha-{git_sha}",
                  "imageId": image_id(f"artfetch-frontend:{version}"),
                  "tar": f"images/artfetch-frontend-{version}.tar.gz",
              },
              "jupyter": {
                  "service": "jupyter",
                  "versionTag": f"artfetch-jupyter:{version}",
                  "shaTag": f"artfetch-jupyter:sha-{git_sha}",
                  "imageId": image_id(f"artfetch-jupyter:{version}"),
                  "tar": f"images/artfetch-jupyter-{version}.tar.gz",
              },
              "postgres": {
                  "service": "postgres",
                  "ref": "postgres:16-alpine",
                  "imageId": image_id("postgres:16-alpine"),
                  "tar": "images/postgres-16-alpine.tar.gz",
              },
          }
          for image in images.values():
              image["tarSha256"] = sha256_file(release_dir / image["tar"])

          manifest = {
              "app": "artfetch",
              "version": version,
              "gitSha": git_sha,
              "gitShortSha": os.environ["GIT_SHORT_SHA"],
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "releasedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "flywayVersion": os.environ["FLYWAY_VERSION"],
              "images": images,
              "compose": {
                  "file": "docker-compose.prod.yml",
                  "sha256": sha256_file(release_dir / "docker-compose.prod.yml"),
              },
              "build": {
                  "backendTest": "passed",
                  "frontendBuild": "passed",
                  "imageBuild": "passed",
                  "imageExport": "passed",
              },
          }
          (release_dir / "release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("dist/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          tar -C "$dist_dir" -czf "${dist_dir}/artfetch-deploy-${VERSION}.tgz" "artfetch-deploy-${VERSION}"
          (
            cd "$dist_dir"
            sha256sum "artfetch-deploy-${VERSION}.tgz" > "artfetch-deploy-${VERSION}.tgz.sha256"
          )

      - name: Validate release package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum -c "artfetch-deploy-${VERSION}.tgz.sha256")
          tar -tzf "dist/artfetch-deploy-${VERSION}.tgz" >/tmp/artfetch-package-files.txt
          grep -q "artfetch-deploy-${VERSION}/images/postgres-16-alpine.tar.gz" /tmp/artfetch-package-files.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          root = Path("dist") / f"artfetch-deploy-{version}"
          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          if manifest["app"] != "artfetch":
              raise SystemExit("manifest app mismatch")
          if manifest["version"] != version or manifest["flywayVersion"] != version:
              raise SystemExit("manifest version/flyway mismatch")
          for key, image in manifest["images"].items():
              tar = root / image["tar"]
              if not tar.is_file():
                  raise SystemExit(f"missing image tar for {key}: {tar}")
              actual = sha256_file(tar)
              if actual != image["tarSha256"]:
                  raise SystemExit(f"image tar sha mismatch for {key}")
          compose_sha = sha256_file(root / "docker-compose.prod.yml")
          if compose_sha != manifest["compose"]["sha256"]:
              raise SystemExit("compose sha mismatch")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.releaseNotes }}
          GIT_SHA: ${{ steps.release.outputs.gitSha }}
        run: |
          set -Eeuo pipefail
          if git rev-parse "release/${VERSION}" >/dev/null 2>&1; then
            existing="$(git rev-parse "release/${VERSION}")"
            if [ "$existing" != "$GIT_SHA" ]; then
              echo "Tag release/${VERSION} already exists at ${existing}, expected ${GIT_SHA}."
              exit 1
            fi
          else
            git tag "release/${VERSION}" "$GIT_SHA"
            git push origin "release/${VERSION}"
          fi
          printf '%s\n' "$RELEASE_NOTES" > dist/release-notes.md
          gh release create "release/${VERSION}" \
            dist/release-manifest.json \
            "dist/artfetch-deploy-${VERSION}.tgz" \
            "dist/artfetch-deploy-${VERSION}.tgz.sha256" \
            dist/install-or-upgrade-latest.sh \
            --title "${VERSION}" \
            --notes-file dist/release-notes.md \
            --verify-tag
