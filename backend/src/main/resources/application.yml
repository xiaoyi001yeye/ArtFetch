server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/artfetch
    username: artfetch
    password: artfetch123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

artfetch:
  source:
    # 雅昌艺搜拍品检索地址
    base-url: https://artso.artron.net/auction/search_auction.php
    # 每轮抓取完毕后等待多少秒再开始下一轮（0 = 不重复，只抓一次）
    fetch-interval-seconds: 0
    # 两次请求之间的间隔毫秒（避免请求过快被限流）
    request-delay-ms: 1000
  task:
    # 同时运行的最大任务数
    max-concurrent-tasks: 5
    # 任务线程池大小
    thread-pool-size: 10
